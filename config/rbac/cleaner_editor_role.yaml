# This rule is not used by the project likvidator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.altech.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: likvidator
    app.kubernetes.io/managed-by: kustomize
  name: cleaner-editor-role
rules:
- apiGroups:
  - apps.altech.com
  resources:
  - cleaners
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.altech.com
  resources:
  - cleaners/status
  verbs:
  - get
