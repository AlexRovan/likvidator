# Example Cleaner + JIRA Secret. Create the namespace first if needed:
#   kubectl create namespace likvidator-system
# Replace apiToken before use. Sample runs with dryRun: true (no helm uninstall).
apiVersion: v1
kind: Namespace
metadata:
  name: likvidator-system
  labels:
    app.kubernetes.io/name: likvidator
---
apiVersion: v1
kind: Secret
metadata:
  name: jira-credentials
  namespace: likvidator-system
  labels:
    app.kubernetes.io/name: likvidator
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  url: "https://jira.example.com"
  username: "likvidator-bot"
  apiToken: "REPLACE_ME"
---
apiVersion: apps.altech.com/v1
kind: Cleaner
metadata:
  labels:
    app.kubernetes.io/name: likvidator
    app.kubernetes.io/managed-by: kustomize
  name: cluster-cleaner
  namespace: likvidator-system
spec:
  dryRun: true
  interval: 15m

  # Namespaces labeled environment=dev (empty selector = only Cleaner's namespace)
  namespaceSelector:
    matchLabels:
      environment: dev

  cleanerLabelKey: cleaner
  releaseLabelKey: release

  unhealthyDuration: 48h
  jiraGracePeriod: 24h
  staleReleaseDuration: 336h

  jira:
    secretRef:
      name: jira-credentials
